name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run regression tests
        run: uv run --locked pytest -q

      - name: Run finite headless examples
        run: uv run --locked python scripts/smoke_examples.py

      - name: Build distributions
        run: uv build

      - name: Install and import the wheel in isolation
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/ns-wheel"
          uv pip install --python "$RUNNER_TEMP/ns-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/ns-wheel/bin/python" -I - <<'PY'
          import importlib
          import importlib.metadata
          import pkgutil
          import ns

          modules = list(pkgutil.walk_packages(ns.__path__, ns.__name__ + "."))
          for module in modules:
              importlib.import_module(module.name)
          assert ns.__version__ == importlib.metadata.version("ns.py")
          print(f"Imported ns.py {ns.__version__} and {len(modules)} submodules")
          PY
