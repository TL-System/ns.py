[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ns.py"
version = "0.4.5"
description = "ns.py: a pythonic discrete-event network simulator"
readme = "README.md"
# Match NetworkX's exclusion of the affected CPython 3.14.1 patch release.
requires-python = ">=3.14,!=3.14.1"
license = { file = "LICENSE" }
authors = [
  { name = "TL-System" }
]
keywords = [
  "discrete-event simulator",
  "computer networking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Education",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "simpy>=4.1.2",
  "networkx>=3.7",
  "numpy>=2.5.3",
  "pyyaml>=6.0.3",
  "matplotlib>=3.11.2"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty==0.0.84",
]

[project.urls]
Homepage = "https://github.com/TL-System/ns.py"
Repository = "https://github.com/TL-System/ns.py"

[tool.hatch.build.targets.wheel]
packages = ["ns"]
